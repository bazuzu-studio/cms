# ─────────────────────────────────────────────────────────────────────────────
# [Dokploy] Compose: только Payload CMS для cms.otakuum.ru
#
# PostgreSQL и MinIO (S3) в этот стек НЕ входят — это отдельные сервисы вашего
# проекта Dokploy. CMS подключается к ним по внутренним именам через сеть
# dokploy-network; значения задаются во вкладке Environment (см. dokploy.env).
#
# Тот же результат даёт сервис типа Application (Build Type: Dockerfile) —
# compose нужен только если хотите описать домен лейблами, а не в UI.
#
# Маршрутизация (Traefik, лейблы ниже — домен в UI Dokploy для этого compose
# добавлять НЕ нужно, иначе будут дубли роутеров):
#   https://cms.otakuum.ru → cms:3000 (админка и API)
# ─────────────────────────────────────────────────────────────────────────────

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # PostgreSQL: внутренний хост из карточки БД в Dokploy (Internal Host)
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      CMS_URL: ${CMS_URL:-https://cms.otakuum.ru}
      FRONTEND_URL: ${FRONTEND_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # S3/MinIO: S3_ENDPOINT — внутренний адрес для сервера CMS,
      # S3_PUBLIC_URL — публичный адрес файлов для браузера (https).
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}
    networks:
      - dokploy-network # Traefik + внутренние имена БД и MinIO
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS
      - traefik.http.routers.movhub-cms.rule=Host(`cms.otakuum.ru`)
      - traefik.http.routers.movhub-cms.entrypoints=websecure
      - traefik.http.routers.movhub-cms.tls.certresolver=letsencrypt
      - traefik.http.routers.movhub-cms.service=movhub-cms
      - traefik.http.services.movhub-cms.loadbalancer.server.port=3000
      # HTTP → HTTPS
      - traefik.http.routers.movhub-cms-web.rule=Host(`cms.otakuum.ru`)
      - traefik.http.routers.movhub-cms-web.entrypoints=web
      - traefik.http.routers.movhub-cms-web.middlewares=redirect-to-https@file
      - traefik.http.routers.movhub-cms-web.service=movhub-cms

networks:
  dokploy-network:
    external: true
