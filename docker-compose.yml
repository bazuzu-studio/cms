# ─────────────────────────────────────────────────────────────────────────────
# Dokploy (Compose): Payload CMS + MinIO (S3) для cms.otakuum.ru
#
# Что поднимается:
#   cms               — Payload CMS + Admin Panel (Next.js), порт 3000
#   movhub-minio      — S3-хранилище медиафайлов
#   movhub-minio-init — одноразово создаёт бакет и открывает его на чтение
#
# PostgreSQL здесь НЕ поднимается: используется уже созданная в Dokploy БД
# (my-first-project-database-jxz2iy), доступная по внутренней сети dokploy-network.
#
# Маршрутизация (Traefik, настроена лейблами ниже — домены в UI Dokploy
# для этого compose добавлять НЕ нужно, иначе будут дубли роутеров):
#   https://cms.otakuum.ru          → cms:3000     (админка и API)
#   https://cms.otakuum.ru/media/*  → minio:9000   (публичная отдача файлов)
#
# Все значения берутся из вкладки Environment (см. dokploy.env / .env.example).
# ─────────────────────────────────────────────────────────────────────────────

services:
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      movhub-minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      CMS_URL: ${CMS_URL:-https://cms.otakuum.ru}
      FRONTEND_URL: ${FRONTEND_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://movhub-minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://cms.otakuum.ru/media}
    networks:
      - default        # связь с MinIO
      - dokploy-network # Traefik + доступ к БД Dokploy
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS
      - traefik.http.routers.movhub-cms.rule=Host(`cms.otakuum.ru`)
      - traefik.http.routers.movhub-cms.entrypoints=websecure
      - traefik.http.routers.movhub-cms.tls.certresolver=letsencrypt
      - traefik.http.routers.movhub-cms.service=movhub-cms
      - traefik.http.services.movhub-cms.loadbalancer.server.port=3000
      # HTTP → HTTPS
      - traefik.http.routers.movhub-cms-web.rule=Host(`cms.otakuum.ru`)
      - traefik.http.routers.movhub-cms-web.entrypoints=web
      - traefik.http.routers.movhub-cms-web.middlewares=redirect-to-https@file
      - traefik.http.routers.movhub-cms-web.service=movhub-cms

  movhub-minio:
    # Версия зафиксирована намеренно — не используем :latest в production.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Только публичное чтение файлов: https://cms.otakuum.ru/media/<файл>
      # Путь совпадает с именем бакета (path-style), StripPrefix не нужен.
      # Если меняете S3_BUCKET — поменяйте /media/ здесь и в S3_PUBLIC_URL.
      - traefik.http.routers.movhub-media.rule=Host(`cms.otakuum.ru`) && PathPrefix(`/media/`)
      - traefik.http.routers.movhub-media.priority=100
      - traefik.http.routers.movhub-media.entrypoints=websecure
      - traefik.http.routers.movhub-media.tls.certresolver=letsencrypt
      - traefik.http.routers.movhub-media.service=movhub-media
      - traefik.http.services.movhub-media.loadbalancer.server.port=9000
      - traefik.http.routers.movhub-media-web.rule=Host(`cms.otakuum.ru`) && PathPrefix(`/media/`)
      - traefik.http.routers.movhub-media-web.priority=100
      - traefik.http.routers.movhub-media-web.entrypoints=web
      - traefik.http.routers.movhub-media-web.middlewares=redirect-to-https@file
      - traefik.http.routers.movhub-media-web.service=movhub-media

  # Одноразовая инициализация: создаёт бакет и разрешает анонимное чтение
  # (без листинга и записи). Идемпотентна — безопасно запускается при каждом деплое.
  movhub-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      movhub-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://movhub-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        echo "Bucket $$S3_BUCKET is ready (public read)."
    networks:
      - default

networks:
  dokploy-network:
    external: true

volumes:
  minio_data:
